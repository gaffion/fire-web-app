<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fire Web App</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }

    .app {
      max-width: 760px;
      margin: 0 auto;
      padding: 18px 14px 28px;
    }

    .title {
      font-size: 24px;
      font-weight: 800;
      margin: 0;
    }

    .subtitle {
      margin: 6px 0 18px;
      color: #64748b;
      font-size: 14px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .summary-card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .summary-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .summary-icon {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .summary-label {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.2;
    }

    .summary-value {
      font-size: 32px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .search {
      flex: 1;
      height: 44px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      padding: 0 14px;
      font-size: 15px;
      background: white;
      box-sizing: border-box;
    }

    .btn {
      height: 44px;
      padding: 0 14px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    .filter-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 14px;
      padding-bottom: 2px;
    }

    .filter-row::-webkit-scrollbar {
      display: none;
    }

    .filter-chip {
      height: 38px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid #cbd5e1;
      background: #fff;
      color: #475569;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
    }

    .filter-chip.active {
      background: #2563eb;
      color: #fff;
      border-color: #2563eb;
    }

    .status {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 12px;
    }

    .error {
      color: #b91c1c;
      font-size: 14px;
      margin-bottom: 12px;
      white-space: pre-wrap;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .inspection-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-radius: 18px;
      border: 1px solid #e2e8f0;
      padding: 12px;
      box-sizing: border-box;
    }

    .inspection-card.red {
      background: #fee2e2;
      border-color: #fca5a5;
    }

    .inspection-card.green {
      background: #dcfce7;
      border-color: #86efac;
    }

    .inspection-left {
      flex: 1;
      min-width: 0;
    }

    .inspection-code {
      font-size: 18px;
      font-weight: 800;
      line-height: 1.1;
      margin: 0;
    }

    .inspection-location {
      margin-top: 8px;
      font-size: 14px;
      font-weight: 700;
      color: #1f2937;
    }

    .inspection-meta {
      margin-top: 4px;
      font-size: 12px;
      color: #475569;
    }

    .inspection-sub {
      margin-top: 4px;
      font-size: 11px;
      color: #64748b;
    }

    .inspection-right {
      width: 92px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }

    .inspection-action-btn {
      width: 100%;
      min-height: 82px;
      border-radius: 18px;
      border: none;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.25;
      text-align: center;
      padding: 6px 4px;
      color: white;
      cursor: pointer;
    }

    .inspection-action-btn.red {
      background: #ef4444;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.18);
    }

    .inspection-action-btn.green {
      background: #22c55e;
      box-shadow: 0 4px 12px rgba(34, 197, 94, 0.18);
    }

    .inspection-action-btn.edit {
      background: #e2e8f0;
      color: #1f2937;
      box-shadow: none;
    }

    .inspection-action-btn:active,
    .btn:active,
    .filter-chip:active {
      transform: scale(0.98);
    }

    .empty {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 18px;
      text-align: center;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1 class="title">Fire Web App</h1>
    <p class="subtitle">รายการตรวจสอบถังดับเพลิง</p>

    <div class="summary-grid">
      <div class="summary-card">
        <div class="summary-left">
          <div class="summary-icon" style="background:#e2e8f0;">📍</div>
          <div class="summary-label">จุดติดตั้งทั้งหมด</div>
        </div>
        <div id="totalCount" class="summary-value">0</div>
      </div>

      <div class="summary-card">
        <div class="summary-left">
          <div class="summary-icon" style="background:#dbeafe;">✅</div>
          <div class="summary-label" style="color:#2563eb;">ตรวจแล้ว</div>
        </div>
        <div id="checkedCount" class="summary-value" style="color:#2563eb;">0</div>
      </div>

      <div class="summary-card">
        <div class="summary-left">
          <div class="summary-icon" style="background:#fee2e2;">⏳</div>
          <div class="summary-label" style="color:#dc2626;">ยังไม่ตรวจ</div>
        </div>
        <div id="uncheckedCount" class="summary-value" style="color:#dc2626;">0</div>
      </div>

      <div class="summary-card">
        <div class="summary-left">
          <div class="summary-icon" style="background:#fef3c7;">⚠️</div>
          <div class="summary-label" style="color:#b45309;">พบปัญหา</div>
        </div>
        <div id="issueCount" class="summary-value" style="color:#b45309;">0</div>
      </div>
    </div>

    <div class="toolbar">
      <input id="searchInput" class="search" placeholder="ค้นหา point code, พิกัด, อาคาร">
      <button id="btnReload" class="btn">โหลดใหม่</button>
    </div>

    <div class="filter-row" id="filterRow">
      <button class="filter-chip active" data-filter="all">ทั้งหมด</button>
      <button class="filter-chip" data-filter="unchecked">ยังไม่ตรวจ</button>
      <button class="filter-chip" data-filter="checked">ตรวจแล้ว</button>
      <button class="filter-chip" data-filter="issue">พบปัญหา</button>
      <button class="filter-chip" data-filter="red">ถังสีแดง</button>
      <button class="filter-chip" data-filter="green">ถังสีเขียว</button>
    </div>

    <div id="status" class="status">กำลังเตรียมระบบ...</div>
    <div id="error" class="error"></div>
    <div id="list" class="list"></div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
